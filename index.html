<!DOCTYPE html>
<html lang="en"></html>
<head>
     <meta charset="UTF-8" />
     <link rel="stylesheet" type="text/css" href="style.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

     <title>Prueba :p</title>
</head>
<body>
    
    <div class="main-content">
        <div class="top-banner">
         <img src="cat.png" alt="AAA"  />
         <h2>  This is the Header</h2>
        </div>
        <div class="division">Block </div>
        <!-- Block 1-->
        
    </div>
    <div class="sidebar">
        <h3>Add Elements</h3>
        <!-- existing controls -->
        <select id="element-type">
            <option value="">Select type</option>
            <option value="title">Title</option>
            <option value="text">Text</option>
            <option value="image">Image</option>
            <option value="container">Container</option>
        </select>
        <select id="container-layout" style="display:none;">
            <option value="single">Single Cell</option>
            <option value="2-row">2 Cells in a Row</option>
            <option value="3-row">3 Cells in a Row</option>
            <option value="2-col">2 Cells in a Column</option>
            <option value="3-col">3 Cells in a Column</option>
            <option value="1-2-split">1 by 2 Split</option>
        </select>
        <input type="text" id="element-text" placeholder="Enter text" style="display:none;" />
        <input type="file" id="element-image" accept="image/*" style="display:none;" />
        <button onclick="insertElement()">Insert Element</button>

         <h3>Page Tree</h3>
        <div id="tree-box">
            <ul id="dom-tree"></ul>
        </div>

        <div id="element-properties" style="display:none;">
            <h3 id="selected-element-tag">Element Properties</h3>
            <div class="property-group">
                <label for="bg-color">Background Color:</label>
                <input type="color" id="bg-color">
            </div>
            <div id="text-properties" style="display:none;">
                <div class="property-group">
                    <label for="font-color">Font Color:</label>
                    <input type="color" id="font-color">
                </div>
                <div class="property-group">
                    <label for="font-size">Font Size (px):</label>
                    <input type="number" id="font-size" min="1">
                </div>
            <div class="property-group">
                <label for="element-content">Text Content:</label>
                <textarea id="element-content" rows="3"></textarea>
            </div>
            <div class="property-group">
                <label for="text-align">Text Align</label>
                <select id="text-align">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>
        <div id="image-properties" style="display:none;">
            <div class="property-group">
                <label for="image-width">Width (px):</label>
                <input type="number" id="image-width" min="1">
            </div>
            <div class="property-group">
                <label for="image-height">Height (px):</label>
                <input type="number" id="image-height" min="1">
            </div>
            <div class="property-group">
                <label for="image-file-input">Change Image:</label>
                <input type="file" id="image-file-input" accept="image/*">
            </div>
        </div>
        <div id="layout-properties" style="display:none;">
             <div class="property-group">
                <label for="justify-content">Horizontal Alignment</label>
                <select id="justify-content">
                    <option value="flex-start">Left</option>
                    <option value="center">Center</option>
                    <option value="flex-end">Right</option>
                </select>
            </div>
            <div class="property-group">
                <label for="align-items">Vertical Alignment</label>
                <select id="align-items">
                    <option value="flex-start">Top</option>
                    <option value="center">Center</option>
                    <option value="flex-end">Bottom</option>
                </select>
            </div>
            </div>
            <button id="delete-element-btn">Delete Element</button>
        </div>

        <button id="add-block-btn" class="add-block-btn">Add Block</button>
        <button id="hide-sidebar">✖ Hide Sidebar</button>
 <button id="export-html-btn">Export HTML</button>
    </div>
   <button id="show-sidebar" class="show-sidebar">☰ Show Sidebar</button>

 <script src="page.js"></script> 
</body>

</html>
